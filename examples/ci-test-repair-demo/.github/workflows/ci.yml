name: CI

on:
  push:
    paths:
      - "examples/ci-test-repair-demo/**"
  pull_request:
    paths:
      - "examples/ci-test-repair-demo/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/ci-test-repair-demo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: npm test
